# hypridle base config, started from hyprland.lua
# No auto-suspend while the NVIDIA/DisplayLink resume issues are open

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && hyprctl eval 'panel_sync()'
}

# 5 min: dim the laptop screen
# hyprland.lua keeps the brightness: panel_dim saves and dims it, panel_sync writes it back
listener {
    timeout = 300
    on-timeout = hyprctl eval 'panel_dim()'
    on-resume = hyprctl eval 'panel_sync()'
}

# 10 min: lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 min: screens off, always after the lock
# panel_sync (hyprland.lua) turns the laptop panel dark again while the lid is closed
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && hyprctl eval 'panel_sync()'
}
