# hyprpaper base config: neutral default wallpaper, personal one in user.conf
# PNG, because hyprpaper 0.8.4 does not know .jxl
$wallpaper = /usr/share/wallpapers/convergence.png
source = ~/.config/hypr/user.conf

splash = false

wallpaper {
    monitor = *
    path = $wallpaper
    fit_mode = cover
}
