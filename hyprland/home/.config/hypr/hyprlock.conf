# hyprlock base config: centered layout in the style of DankMaterialShell and Noctalia
# PAM service: /etc/pam.d/hyprlock (includes login)
# Personal variables ($wallpaper, colors) come from user.conf

$wallpaper = /usr/share/wallpapers/convergence.png
$font = Noto Sans
# Default colors; ~/.config/hypr/colors.conf (matugen) overrides them through user.conf
$accent = rgba(33ccffee)
$accent2 = rgba(00ff99ee)
$warn = rgba(ff6633ee)
$error = rgba(ff0066ee)
$text = rgba(e2e2e9ff)
$surface = rgba(1e1f25cc)
source = ~/.config/hypr/user.conf

general {
    hide_cursor = true
    # How long "Authentication failed" and the error ring stay visible, in ms
    fail_timeout = 1500
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

# CLOCK
label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = $font Light
    color = $text

    position = 0, 220
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d. %B"
    font_size = 22
    font_family = $font
    color = $text

    position = 0, 110
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = -1

    inner_color = $surface
    outer_color = $accent
    check_color = $accent2
    fail_color = $error
    font_color = $text

    font_family = $font
    fade_on_empty = false
    placeholder_text = Passwort …
    fail_text = $PAMFAIL

    dots_size = 0.25
    dots_spacing = 0.3

    position = 0, -220
    halign = center
    valign = center
}

# BATTERY (script runs through /bin/sh, so ~ expands)
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/battery.sh
    font_size = 14
    font_family = $font
    color = $text

    position = -30, 30
    halign = right
    valign = bottom
}
