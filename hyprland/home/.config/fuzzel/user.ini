# Personal fuzzel settings, loaded at the end of fuzzel.ini
# Colors from the wallpaper (matugen). Start own settings with a section line ([main] or [colors])
include=~/.config/fuzzel/colors.ini

# Spotlight look in the style of DankMaterialShell
[main]
font=Noto Sans:size=12
width=40
lines=8
horizontal-pad=20
vertical-pad=14
inner-pad=10
icon-theme=breeze-dark
icons-enabled=yes
# Fixed layer name for the blur rule in ~/.config/hypr/user.lua
namespace=launcher

[border]
width=2
radius=16
selection-radius=10
